[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "durable-incident-agent"
version = "0.1.0"
description = "Controlled durable incident-response agent experiment"
requires-python = ">=3.10"
dependencies = [
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=2,<4",
  "pydantic>=2.7,<3",
  "openai>=2,<3",
  "opentelemetry-api>=1.30,<2",
  "opentelemetry-sdk>=1.30,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
