[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "test-driven-code-repair-agent"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3", "openai>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
